[pytest]
testpaths = tests
pythonpath = .
# basetemp: the default %TEMP%\pytest-of-<user> folder is access-denied on this machine
addopts = -ra --strict-markers -p no:cacheprovider --basetemp=.pytest_tmp
markers =
    unit: fast, isolated tests of a single component
    integration: Flask API + database tests through the test client
    e2e: full borrower lifecycle on synthetic document packs
    regression: golden-output and model-quality regression tests
    security: security regression tests
    ocr: needs the RapidOCR engine (skipped when unavailable)
    slow: latency / performance smoke tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
